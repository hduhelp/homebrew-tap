name: Sync Multica Formula

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-multica-formula
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate formula from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/update-formula.sh

      - name: Commit formula update
        shell: bash
        run: |
          if git diff --quiet -- Formula/multica.rb; then
            echo "Formula is already current."
            exit 0
          fi
          version="$(sed -n 's/^  version "\([^"]*\)"/\1/p' Formula/multica.rb)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/multica.rb
          git commit -m "chore: update multica to v$version"
          git push
